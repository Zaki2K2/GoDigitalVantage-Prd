name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/api audit --omit=dev --audit-level=high
      - run: npm --prefix apps/web audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm --prefix apps/api run typecheck
      - run: npx --prefix apps/web tsc -p apps/web/tsconfig.app.json --noEmit
      - run: npx --prefix apps/web tsc -p apps/web/tsconfig.spec.json --noEmit
      - run: npm --prefix apps/api test
      - run: npm --prefix apps/web test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
