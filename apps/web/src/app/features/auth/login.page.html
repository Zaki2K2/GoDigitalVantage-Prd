<app-auth-layout>
  <p class="eyebrow mb-2">Welcome back</p>
  <h1 class="mb-1 text-title-sm font-semibold">Sign in</h1>
  <p class="muted mb-8">Access your GoDigitalVantage workspace.</p>

  @if (error(); as message) {
    <div class="alert" role="alert">
      <app-icon name="alert" [size]="18" /><span>{{ message }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@business.com"
        [class.invalid]="invalid('email')"
        [attr.aria-invalid]="invalid('email')"
      />
      @if (invalid('email')) {
        <span class="error">Enter a valid email address.</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          class="!pr-20"
          [class.invalid]="invalid('password')"
          [attr.aria-invalid]="invalid('password')"
        />
        <button
          type="button"
          class="absolute top-1/2 right-2 -translate-y-1/2 rounded-md px-2 py-1 text-theme-xs font-medium text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-pressed]="showPassword()"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (invalid('password')) {
        <span class="error">Password is required.</span>
      }
    </div>

    <button type="submit" class="btn block mt-2" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="muted mt-6 text-center">
    No account? <a routerLink="/register" class="font-medium">Create one</a>
  </p>
</app-auth-layout>
