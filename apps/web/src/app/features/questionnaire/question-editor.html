<div
  class="card !p-4 sm:!p-5 transition"
  role="group"
  [attr.aria-label]="'Question ' + number"
  [class.has-issue]="issues().length > 0"
  [class.border-error-300]="issues().length > 0"
  [formGroup]="group()"
>
  <div class="mb-4 flex items-center justify-between gap-3">
    <h3 class="!m-0 flex items-center gap-2.5 !text-theme-sm">
      <span
        class="flex size-7 items-center justify-center rounded-lg bg-brand-50 text-theme-xs font-semibold text-brand-700 dark:bg-brand-500/15 dark:text-brand-400"
        aria-hidden="true"
      >
        {{ number }}
      </span>
      Question {{ number }}
    </h3>
    @if (!disabled()) {
      <div class="flex items-center gap-1">
        <button
          type="button"
          class="icon-btn !size-9"
          [disabled]="index() === 0"
          [attr.aria-label]="'Move question ' + number + ' up'"
          (click)="move.emit(-1)"
        >
          <app-icon name="arrow-up" [size]="16" />
        </button>
        <button
          type="button"
          class="icon-btn !size-9"
          [disabled]="index() === count() - 1"
          [attr.aria-label]="'Move question ' + number + ' down'"
          (click)="move.emit(1)"
        >
          <app-icon name="arrow-down" [size]="16" />
        </button>
        <button
          type="button"
          class="icon-btn !size-9 hover:!border-error-200 hover:!bg-error-50 hover:!text-error-600"
          [attr.aria-label]="'Delete question ' + number"
          (click)="remove.emit()"
        >
          <app-icon name="trash" [size]="16" />
        </button>
      </div>
    }
  </div>

  <div class="field">
    <label [for]="'label-' + index()">Question text</label>
    <input
      [id]="'label-' + index()"
      type="text"
      formControlName="label"
      placeholder="What would you like to ask?"
    />
  </div>

  <div class="field">
    <label [for]="'help-' + index()">Help text (optional)</label>
    <input [id]="'help-' + index()" type="text" formControlName="helpText" />
  </div>

  <div class="flex flex-wrap items-end gap-x-6 gap-y-3">
    <div class="field !mb-0 min-w-48 flex-1">
      <label [for]="'type-' + index()">Answer type</label>
      <select
        appSelect
        [id]="'type-' + index()"
        [value]="group().controls.type.value"
        [disabled]="disabled()"
        (change)="onType($event)"
      >
        @for (t of types; track t) {
          <option [value]="t" [selected]="t === group().controls.type.value">
            {{ typeLabels[t] }}
          </option>
        }
      </select>
    </div>
    <label
      class="mb-2.5 inline-flex cursor-pointer items-center gap-2.5 text-theme-sm font-medium text-gray-700 dark:text-gray-300"
    >
      <input type="checkbox" formControlName="required" class="size-4" />
      Required
    </label>
  </div>

  @if (hasChoices) {
    <fieldset class="m-0 mt-4 min-w-0 border-0 p-0" [disabled]="disabled()">
      <legend class="mb-2 text-theme-sm font-medium text-gray-700 dark:text-gray-300">
        Choices
      </legend>
      <div class="choices">
        @for (c of group().controls.choices.controls; track c; let j = $index) {
          <div class="choice mb-2 flex items-center gap-2" [formGroup]="c">
            <span
              class="flex size-9 shrink-0 items-center justify-center text-theme-xs text-gray-400"
              aria-hidden="true"
            >
              {{ j + 1 }}
            </span>
            <input
              type="text"
              class="input"
              formControlName="label"
              [attr.aria-label]="'Choice ' + (j + 1) + ' of question ' + number"
            />
            <button
              type="button"
              class="icon-btn !size-9 shrink-0 hover:!border-error-200 hover:!bg-error-50 hover:!text-error-600"
              [disabled]="group().controls.choices.length <= 2 || disabled()"
              [attr.aria-label]="'Remove choice ' + (j + 1) + ' of question ' + number"
              (click)="removeChoice(j)"
            >
              <app-icon name="close" [size]="16" />
            </button>
          </div>
        }
        @if (!disabled()) {
          <button
            type="button"
            class="btn secondary sm btn-add"
            [disabled]="group().controls.choices.length >= 10"
            (click)="addChoice()"
          >
            <app-icon name="plus" [size]="14" /> Add choice
          </button>
        }
      </div>
    </fieldset>
  }

  @for (message of issues(); track message) {
    <p
      class="error mt-3 mb-0 flex items-center gap-1.5 text-theme-sm text-error-600 dark:text-error-400"
      role="alert"
    >
      <app-icon name="alert" [size]="16" />{{ message }}
    </p>
  }
</div>
